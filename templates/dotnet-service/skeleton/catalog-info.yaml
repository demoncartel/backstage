apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description | dump }}
  annotations:
    github.com/project-slug: ${{ values.destination.owner }}/${{ values.destination.repo }}
    backstage.io/techdocs-ref: dir:.
  tags: [dotnet, csharp{% if values.dataClassification != 'none' %}, ${{ values.dataClassification }}{% endif %}]
  links:
    - url: https://github.com/${{ values.destination.owner }}/${{ values.destination.repo }}/actions
      title: CI
      icon: dashboard
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: ${{ values.system }}
  providesApis:
    - ${{ values.name }}-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: ${{ values.name }}-api
  description: HTTP API of ${{ values.name }}, generated from the code at build time.
  tags: [openapi]
spec:
  type: openapi
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: ${{ values.system }}
  definition:
    $text: ./openapi/openapi.json
