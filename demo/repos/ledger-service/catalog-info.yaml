apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: ledger-api
  title: "Ledger API"
  description: "Post balanced journal entries and read account history."
  tags: [rest, sox]
spec:
  type: openapi
  lifecycle: production
  owner: group:team-accounts
  system: accounts
  definition:
    $text: ./openapi.yaml
